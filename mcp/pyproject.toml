[project]
name = "freemol-mcp"
version = "0.1.0"
description = "MCP tools wrapping freemol's coordinate-transformation programs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
freemol-mcp = "freemol_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
